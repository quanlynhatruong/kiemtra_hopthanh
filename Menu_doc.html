<!-- 
  Tên file: Menu_doc.html
  Chức năng: Thanh điều hướng dọc (Sidebar) cho hệ thống Kiểm tra nội bộ
  Tác giả: Hoàng Ngọc Lâm
-->
<style>
  .sidebar-menu { 
      width: 260px; 
      background: #ffffff; 
      border-right: 1px solid #e5e7eb; 
      height: 100vh; 
      position: sticky; 
      top: 0; 
      display: flex; 
      flex-direction: column; 
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
      font-family: "Times New Roman", serif;
      z-index: 1000;
  }
  .sidebar-header {
      padding: 25px 15px;
      text-align: center;
      border-bottom: 2px solid #f3f4f6;
      margin-bottom: 15px;
  }
  .sidebar-logo {
      width: 65px;
      height: 65px;
      object-fit: contain;
      margin-bottom: 12px;
  }
  .sidebar-title {
      color: #b91c1c;
      font-weight: bold;
      font-size: 15px;
      text-transform: uppercase;
      margin: 0;
      line-height: 1.3;
  }
  .sidebar-subtitle {
      color: #1e3a8a;
      font-size: 13px;
      font-weight: bold;
      margin-top: 5px;
      letter-spacing: 0.5px;
  }
  .menu-list {
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
  }
  .menu-btn { 
      padding: 12px 15px; 
      background: transparent; 
      border: 1px solid transparent; 
      text-align: left; 
      font-weight: bold; 
      color: #4b5563; 
      border-radius: 8px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      font-size: 14px;
      text-transform: uppercase;
  }
  .menu-btn i { font-size: 18px; width: 20px; text-align: center; }
  .menu-btn:hover { 
      background: #f8fafc; 
      color: #1e3a8a; 
      border-color: #cbd5e1;
  }
  .menu-btn.active { 
      background: #1e3a8a; 
      color: white; 
      box-shadow: 0 4px 6px rgba(30, 58, 138, 0.2);
  }
  
  .menu-bottom-section {
      margin-top: auto; 
      padding: 0 12px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      margin-bottom: 10px;
  }
  
  .menu-logout { 
      margin-bottom: 25px;
      margin-left: 12px;
      margin-right: 12px;
      color: #dc2626; 
      background: #fef2f2; 
      border: 1px solid #fca5a5;
      justify-content: center;
      text-transform: uppercase;
  }
  .menu-logout:hover { 
      background: #fee2e2; 
      color: #b91c1c;
  }
</style>

<div class="sidebar-menu">
  <div class="sidebar-header">
    <img src="https://i.ibb.co/S46wLjDt/logo-tr-ng-TH-THCS-Hop-Thanh3-removebg-preview.png" class="sidebar-logo" alt="Logo">
    <h3 class="sidebar-title">SỔ KIỂM TRA NỘI BỘ</h3>
    <div class="sidebar-subtitle">TH&THCS HỢP THÀNH</div>
  </div>
  
  <div class="menu-list">
      <button class="menu-btn active" onclick="chuyentth('TabNhapLieu', this)">
          <i class="bi bi-pencil-square"></i> GHI SỔ KIỂM TRA
      </button>
      <button class="menu-btn" onclick="chuyentth('TabTimKiem', this)">
          <i class="bi bi-search"></i> THỐNG KÊ - TRA CỨU
      </button>
      <button class="menu-btn" onclick="chuyentth('TabHuongDan', this)">
          <i class="bi bi-info-circle"></i> HƯỚNG DẪN SỬ DỤNG
      </button>
  </div>

  <div class="menu-bottom-section">
      <button class="btn-ai-trigger w-100 justify-content-center" onclick="toggleAIChat()" style="border-radius: 8px; padding: 10px; font-size: 13px;">
          <i class="bi bi-robot"></i> Trợ Giúp Hướng Dẫn
      </button>
      
      <div class="dev-badge-container w-100 justify-content-center" style="border-radius: 8px; padding: 8px 5px;">
        <div class="dev-icon-fly" style="margin-right: 8px; font-size: 14px;">🚀</div>
        <div class="dev-text-group" style="text-align: left;">
          <div class="dev-name-label" style="font-size: 10px;">HOÀNG NGỌC LÂM</div>
          <div class="dev-role-label" style="font-size: 9px;">System Developer</div>
        </div>
      </div>
  </div>

  <button class="menu-btn menu-logout" onclick="dangxg()">
      <i class="bi bi-door-open"></i> ĐĂNG XUẤT
  </button>
</div>
